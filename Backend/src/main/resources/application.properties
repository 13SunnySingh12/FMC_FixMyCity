spring.application.name=fmc-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# All secrets arrive as environment variables (or the root .env for local runs).
fmc.jwt.secret=${JWT_SECRET}
fmc.jwt.ttl=8h
fmc.admin.email=${ADMIN_EMAIL:}
fmc.admin.password=${ADMIN_PASSWORD:}
