spring.application.name=fmc-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# All secrets arrive as environment variables (or the root .env for local runs).
fmc.jwt.secret=${JWT_SECRET}
fmc.jwt.ttl=8h
fmc.admin.email=${ADMIN_EMAIL:}
fmc.admin.password=${ADMIN_PASSWORD:}

# Backblaze B2 private bucket (S3-compatible API). Only this backend ever holds these credentials.
fmc.storage.endpoint=${B2_ENDPOINT:}
fmc.storage.bucket=${B2_BUCKET:}
fmc.storage.key-id=${B2_KEY_ID:}
fmc.storage.application-key=${B2_APPLICATION_KEY:}
fmc.storage.signed-url-ttl=10m

# One complaint image or up to five resolution proofs of 5 MB each per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
