spring.application.name=fmc-backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Keep no idle connections so Neon can scale to zero; a refilled idle pool would keep waking the database.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
# Fail within 10 s when the database is unreachable (default 30 s); a Neon cold start needs far less.
spring.datasource.hikari.connection-timeout=10000

spring.mvc.problemdetails.enabled=true

management.endpoints.web.exposure.include=health

# All secrets arrive as environment variables (or the root .env for local runs).
fmc.jwt.secret=${JWT_SECRET}
fmc.jwt.ttl=8h
fmc.admin.email=${ADMIN_EMAIL:}
fmc.admin.password=${ADMIN_PASSWORD:}

# Backblaze B2 private bucket (S3-compatible API). Only this backend ever holds these credentials.
fmc.storage.endpoint=${B2_ENDPOINT:}
fmc.storage.bucket=${B2_BUCKET:}
fmc.storage.key-id=${B2_KEY_ID:}
fmc.storage.application-key=${B2_APPLICATION_KEY:}
fmc.storage.signed-url-ttl=10m

# FastAPI AI service; the shared key authenticates this backend to it.
fmc.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
fmc.ai.api-key=${AI_SERVICE_API_KEY:}
# First retry delay for failed analyses; later retries wait 4x longer each time.
fmc.ai.retry-delay=30s

# One complaint image or up to five resolution proofs of 5 MB each per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
